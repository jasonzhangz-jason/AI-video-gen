[project]
name = "v2i"
version = "0.1.0"
description = "Video to insight: yt-dlp + faster-whisper + LLM pipeline (download -> transcribe -> distill)"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.8.6",
    "faster-whisper>=1.0.3",
    "av>=14,<19",          # av 19 去掉了 faster-whisper 依赖的 metadata_errors 参数
    "requests>=2.31",
    "imageio-ffmpeg>=0.5.1",
    "opencc-python-reimplemented>=0.1.7",  # 中文繁体 -> 简体（Whisper 偶尔吐繁体）
]

[project.scripts]
v2i = "v2i.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["v2i"]

[tool.setuptools.package-data]
v2i = ["prompts/*.md", "static/*"]
